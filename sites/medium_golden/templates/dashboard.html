<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard -- Medium Golden</title>
  <style>
    body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; max-width: 800px; margin: 60px auto; padding: 24px; }
    h1 { color: #4caf50; }
    .card { background: #16213e; padding: 20px; border-radius: 8px; margin-top: 20px; }
    code { background: #0f3460; padding: 2px 8px; border-radius: 4px; }
    button { padding: 10px 20px; background: #4caf50; border: none; border-radius: 4px; color: #fff; cursor: pointer; }
    button:hover { background: #388e3c; }
    #api-result { color: #4caf50; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Dashboard</h1>
  <p>Welcome, <strong>{{ user }}</strong>!</p>

  <div class="card">
    <h2>API Test</h2>
    <!-- FIX: now calls correct endpoint /api/data instead of /api/wrong-endpoint -->
    <p>Calls <code>/api/data</code> -- returns a valid result.</p>
    <button onclick="callApi()">Call API</button>
    <div id="api-result"></div>
  </div>

  <div class="card">
    <h2>Session</h2>
    <p>Session persists correctly -- refreshing this page will keep you logged in.</p>
    <p><a href="/login" style="color:#4caf50">Logout</a></p>
  </div>

  <script>
    // FIX: correct endpoint used -- no 404
    function callApi() {
      fetch("/api/data")
        .then(r => r.json())
        .then(data => {
          document.getElementById("api-result").textContent = "Result: " + data.result;
        })
        .catch(e => {
          document.getElementById("api-result").textContent = "Error: " + e;
        });
    }
  </script>
</body>
</html>
