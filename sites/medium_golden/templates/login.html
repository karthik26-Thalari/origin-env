<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login -- Medium Golden</title>
  <style>
    body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .box { background: #16213e; padding: 40px; border-radius: 8px; width: 320px; }
    h1 { margin-bottom: 24px; font-size: 1.5rem; color: #4caf50; }
    input { width: 100%; padding: 10px; margin-bottom: 14px; border: 1px solid #444; border-radius: 4px; background: #0f3460; color: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #4caf50; border: none; border-radius: 4px; color: #fff; font-size: 1rem; cursor: pointer; }
    button:hover { background: #388e3c; }
    .error { color: #ff6b6b; margin-bottom: 12px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Login</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="POST" action="/login">
      <input type="text" name="username" placeholder="Username" />
      <input type="password" name="password" placeholder="Password" />
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
