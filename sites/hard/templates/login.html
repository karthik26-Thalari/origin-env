<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login -- Hard Site</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0d0d0d; color: #eee; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .box { background: #1a1a1a; padding: 40px; border-radius: 8px; width: 340px; border: 1px solid #ff4444; }
    h1 { color: #ff4444; margin-bottom: 24px; }
    input { width: 100%; padding: 10px; margin-bottom: 14px; border: 1px solid #444; border-radius: 4px; background: #111; color: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #ff4444; border: none; border-radius: 4px; color: #fff; font-size: 1rem; cursor: pointer; }
    .error { color: #ff6b6b; margin-bottom: 12px; font-size: 0.9rem; }
    .hint { margin-top: 14px; font-size: 0.75rem; color: #666; }
  </style>
</head>
<body>
  <div class="box">
    <h1>HARD Site Login</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="POST" action="/login">
      <input type="text" name="username" placeholder="Username" />
      <input type="password" name="password" placeholder="Password" />
      <button type="submit">Sign In</button>
    </form>
    <p class="hint">No CSRF token on this form -- intentional vulnerability</p>
  </div>
</body>
</html>
